# Pinned commits for tools that get built from source instead of installed
# via dnf. Read by build.sh. Format: name  repo-url  commit
#
# To bump a pin: cd .build/<name>, check out whatever you want to move to,
# confirm it still builds and runs, then copy its commit hash back in here.
#
# Hyprland and hyprland-plugins below are a different case from ags/the
# picker: those two are pinned to *my own forks*, not upstream, because they
# carry real local patches (not just a version pin) - see packages.other.md.
#
