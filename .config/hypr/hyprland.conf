# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    # 0 = click-to-focus only, like Windows/KDE. Default (1) changes focus
    # to whatever's under the cursor just by moving the mouse over it.
    follow_mouse = 0

    # Matched to your KDE libinput settings (~/.config/kcminputrc had
    # PointerAcceleration=-0.400 with a flat accel profile) so it should feel
    # the same as it did in Plasma - both go through libinput directly.
    sensitivity = -0.4 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Relocated here from the middle of the old KEYBINDINGS section, where it
# sat between two groups of binds. Nothing between the input block above
# and its old position touched input settings, so merging it here is the
# same config: the later block still wins, and kb_options picks up
# compose:ralt instead of the empty value set above.
input {
    kb_layout = us
    kb_options = compose:ralt
}


##############
### SOURCES ##
##############

# Split out by concern. Order matters:
#   - keybinds.conf uses $terminal/$fileManager/$menu, defined above.
#   - windowrules.conf sources UnityFix.conf at its end, which must stay
#     after the center-floating rule to keep Unity's popups at the cursor.
#   - the theme is sourced LAST so it can override colors from styling.conf.
###############
### PLUGINS ###
###############
plugin {
    hyprbars {
        hover_to_reveal = true
        bar_blur = true
     	# Enable bar height and color
        bar_height = 28
        bar_color = rgba(2a2a2aa2)
        col.text = rgb(ffffff)
        bar_text_size = 11
        
        # Position and styling buttons (Left side for macOS)
        bar_buttons_alignment = right
        bar_button_padding = 6
        bar_padding = 8

        # Nerd Font glyphs for the buttons below (icon_font is a custom
        # patch - see ~/Github/hyprland-plugins - the icon font used to be
        # hardcoded to "sans", which doesn't have these glyphs at all).
        # Using the VS Code "chrome_*" set specifically since those are
        # already designed as tiny titlebar window-control icons.
        icon_font = CaskaydiaCove Nerd Font Propo

        # Define close, maximize, minimize buttons style/actions
        # macOS standard: Close (Red), Minimize (Yellow), Maximize/Zoom (Green)
        hyprbars-button = rgb(ff5f56), 12, , hyprctl dispatch killactive
        hyprbars-button = rgb(ffbd2e), 12, , ~/.config/hypr/scripts/minimize-toggle.sh
        hyprbars-button = rgb(27c93f), 12, 󰹵, hyprctl dispatch fullscreen 1
    
    }
}

source = ~/.config/hypr/styling.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/themes/current/hyprland.conf
