# dark-gray - Hyprland appearance deltas.
#
# Pulled in by the main config with:
#     source = ~/.config/hypr/themes/current/hyprland.conf
# where `current` is a symlink apply.sh repoints. Switching themes is then
# "repoint the symlink, hyprctl reload" and takes effect live.
#
# ONLY put things here that hyprctl reload can actually apply. In particular
# NO `env =` lines - environment variables are read once when a process spawns,
# so an env change in a theme file would appear to do nothing until you log out
# and would be maddening to debug. Those stay in the main hyprland.conf.

general {
    col.active_border = rgb(1F7BC4) rgb(1A3347) 45deg
    col.inactive_border = rgb(141F24)
}

decoration {
    # Windows get their translucency from CSS (GTK) and Kvantum (Qt), which
    # fades only backgrounds and leaves text opaque. Hyprland's own opacity
    # fades text too, so it is kept at 1.0 for the focused window and used
    # only as a mild inactive cue.
    active_opacity = 1.0
    inactive_opacity = 0.92

    shadow {
        color = rgba(00000066)
    }

    blur {
        size = 4
        passes = 2
        vibrancy = 0.1696
    }
}

# hyprbars' titlebar has its own dark fallback in hyprland.conf's main plugin
# block, overridden here per-theme the same way col.active_border is above.
plugin {
    hyprbars {
        bar_color = rgba(1A3347a2)
    }
}
