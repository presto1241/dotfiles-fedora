# Manifest for the "dark-gray" theme.
#
# This file names which ALREADY-INSTALLED themes each toolkit should use. It
# deliberately does not re-implement GTK or Kvantum theming - hand-authoring a
# full GTK stylesheet is a losing game. Point at an upstream theme, then layer
# deltas on top via palette.css / gtk.css in this same directory.
#
# Read by ~/.config/themes/apply.sh. Plain key=value so shell can source it.

name=Dark Gray
color=#0f0f0f

# --- GTK (also drives the ags bar, which reads GTK named colours live) --------
# Must exist in ~/.themes, ~/.local/share/themes or /usr/share/themes.
gtk_theme=Juno-ocean-v40
# prefer-dark | prefer-light. Drives libadwaita, and Qt's colorScheme() if you
# ever switch QT_QPA_PLATFORMTHEME to xdgdesktopportal.
color_scheme=prefer-dark
icon_theme=Amy-Dark-Icons
cursor_theme=McMojave-cursors

# --- Qt ----------------------------------------------------------------------
# Kvantum supplies the Qt palette - measured, it is byte-identical under every
# platform theme, so this one name is what actually decides Qt colours.
kvantum_theme=NoMansSky
# Kvantum registers "kvantum" and "kvantum-dark" as separate style keys.
qt_style=kvantum-dark

# --- Wallpaper ---------------------------------------------------------------
wallpaper=~/Pictures/Wallpapers/VRChat/VRChat_2026-08-21_22-20-23.335_1920x1080.png
