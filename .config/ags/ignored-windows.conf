# Windows listed here are hidden from the AppBar dock.
#
# FORMAT
#   One entry per line. A bare entry matches the window TITLE exactly.
#   Prefix with "class:" to match the window class instead, or "title:"
#   to be explicit. "*" is a wildcard. Lines starting with # are
#   comments; blank lines are ignored.
#
#   This file is re-read automatically when you save it - no need to
#   restart ags.
#
# FINDING A WINDOW'S NAME
#   Open the window, then run:  hyprctl clients
#   Use its "class:" and "title:" values.
#
# EXAMPLES
#   Picture-in-Picture      hide any window titled exactly that
#   class:steam_app_*       hide every Proton/Steam app window
#   title:Steam Big *       prefix-matched title

# ---------------------------------------------------------------
# Unity Editor
# ---------------------------------------------------------------
# Context menus and menu-bar dropdowns map with the bare title "Unity".
# The main editor window is titled "Unity - <project> - ..." so it is not
# affected - except for a moment at launch, before Unity swaps in that
# full title. The dock corrects itself as soon as it does.
Unity

# Tooltips. Unity types these as _NET_WM_WINDOW_TYPE_NORMAL rather than
# TOOLTIP, so the title is the only thing that identifies them.
UnityTooltipWindow

# Unity's other popups also open as separate windows and so also get dock
# entries. These titles are taken from the rules in
# ~/.config/hypr/UnityFix.conf; uncomment the ones you want hidden.
#UnityEditor.AddComponent.AddComponentWindow
#UnityEditor.IMGUI.Controls.AdvancedDropdownWindow
#UnityEditor.Searcher.SearcherWindow
#UnityEditor.Rendering.FilterWindow*
#UnityEditor.IconSelector
#UnityEditorInternal.AddCurvesPopup
#UnityEngine.InputSystem.Editor.AdvancedDropdownWindow
#UnityEditor.PackageManager.UI.Internal.DropdownContainer
#UnityEditor.VFX.UI.VFXFilterWindow
#Select *

# ---------------------------------------------------------------
# Xwayland Video Bridge
# ---------------------------------------------------------------
# Background helper for X11 screen sharing - no real UI. It used to be
# parked on special:hidden, which kept it out of the dock as a side effect,
# but that workspace silently blocked tearing/direct scanout on its monitor
# (see the hide-xwaylandvideobridge rule in ~/.config/hypr/windowrules.conf).
# It now lives as a 1x1 transparent window on a normal workspace, so the
# dock needs to be told to skip it explicitly.
class:xwaylandvideobridge
